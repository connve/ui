name: CI

on:
  pull_request:
    branches:
      - main
  # Pushes to main run this through the release workflow, which waits for it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the run; a release's run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Builds dist/, runs publint and checks dist/ for app aliases, as a publish would.
      - name: Package
        run: npm run package

      - name: Showcase build
        run: npx vite build
